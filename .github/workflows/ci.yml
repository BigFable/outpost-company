name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint (includes architecture boundaries)
        run: pnpm run lint
      - name: Unit tests (vitest)
        run: pnpm run test:unit
      - name: Prototype's inlined core matches packages/core
        run: pnpm run core:check
      - name: Smoke tests (prototype in jsdom)
        run: pnpm test
      - name: Web build serves the legacy prototype
        run: pnpm run test:web
      - name: Balance check against tests/balance/baseline.json
        run: pnpm run balance:check
      - name: Desktop shell launches (Electron, headless)
        run: pnpm run desktop:smoke
