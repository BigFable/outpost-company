packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency install scripts unless listed here.
# electron downloads its binary in postinstall; esbuild fetches its native binary.
onlyBuiltDependencies:
  - electron
  - esbuild

# steamworks-ffi-node asks for koffi ^3.1.5; pin a release at least two weeks old.
overrides:
  koffi: 3.3.2
